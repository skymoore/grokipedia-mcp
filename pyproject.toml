[project]
name = "grokipedia-mcp"
version = "0.2.2"
description = "MCP server for Grokipedia"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "grokipedia-api-sdk>=0.1.3",
  "mcp>=1.28.0",
  "click>=8.4.1",
  "uvicorn>=0.49.0",
  "starlette>=1.3.1",
  "fastmcp>=3.4.2",
]

[project.scripts]
grokipedia-mcp = "grokipedia_mcp.__main__:main"

[dependency-groups]
dev = ["mcp[cli]>=1.28.0"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["grokipedia_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
